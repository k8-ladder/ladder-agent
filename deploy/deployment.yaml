apiVersion: apps/v1
kind: Deployment
metadata:
  name: ladder-agent
  namespace: ladder
  labels: {app.kubernetes.io/name: ladder-agent}
spec:
  replicas: 1
  # One agent at a time runs setup.
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: ladder-agent}
  template:
    metadata:
      labels: {app.kubernetes.io/name: ladder-agent}
    spec:
      serviceAccountName: ladder-agent
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: agent
          image: ladder-agent:dev
          imagePullPolicy: IfNotPresent
          env:
            - name: LADDER_BE_URL
              valueFrom: {secretKeyRef: {name: ladder-agent, key: url}}
            - name: LADDER_AGENT_TOKEN
              valueFrom: {secretKeyRef: {name: ladder-agent, key: token}}
            - name: POD_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
          ports:
            - {name: http, containerPort: 8081}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {}
---
# Gitea posts pushes here (POST /hooks/git), and the agent has Argo CD read
# git at once instead of at its next poll.
apiVersion: v1
kind: Service
metadata:
  name: ladder-agent
  namespace: ladder
  labels: {app.kubernetes.io/name: ladder-agent}
spec:
  selector: {app.kubernetes.io/name: ladder-agent}
  ports:
    - {name: http, port: 80, targetPort: http}
