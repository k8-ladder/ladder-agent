# Dev values only: fakebe on the laptop. In the real install, install.sh
# creates this Secret with the token from the cloud.
apiVersion: v1
kind: Secret
metadata:
  name: ladder-agent
  namespace: ladder
stringData:
  token: dev-token
  # k3d resolves host.k3d.internal to the host.
  url: ws://host.k3d.internal:9000/agent/connect
