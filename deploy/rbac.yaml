apiVersion: v1
kind: ServiceAccount
metadata:
  name: ladder-agent
  namespace: ladder
---
# The agent keeps cluster-admin for its whole life (spec §5.8).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ladder-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: ladder-agent
    namespace: ladder
