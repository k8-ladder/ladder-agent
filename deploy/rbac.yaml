apiVersion: v1
kind: ServiceAccount
metadata:
  name: ladder-agent
  namespace: ladder
---
# cluster-admin for setup only (spec §5.8): once setup is done, the agent
# gives itself the narrow ClusterRole ladder-agent and deletes this binding.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ladder-agent-setup
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: ladder-agent
    namespace: ladder
