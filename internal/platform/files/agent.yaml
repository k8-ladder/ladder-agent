# The agent's own rights once setup is done (spec §5.8). The install script
# gives it cluster-admin only through ClusterRoleBinding ladder-agent-setup,
# which the agent deletes once it has applied the platform. From then on it
# reads as the ClusterRole view does and a little more, makes the namespaces
# of apps and their env Secrets, and keeps its own namespace, Argo CD's
# Ingress and the ApplicationSets' refresh. Applying another platform needs
# that binding back.

# The agent patches its own Deployment to upgrade: whatever runs there meets
# the restricted Pod Security Standard, as the agent does.
apiVersion: v1
kind: Namespace
metadata:
  name: [[ .AgentNamespace ]]
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: [[ .Agent ]]
rules:
  # What cluster.info and kube.read read beyond the ClusterRole view. No
  # Secrets, no pods/exec, attach or portforward, no nodes/proxy.
  - apiGroups: [""]
    resources: [nodes, persistentvolumes]
    verbs: [get, list, watch]
  - apiGroups: [storage.k8s.io]
    resources: [storageclasses, csidrivers]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingressclasses]
    verbs: [get, list, watch]
  - apiGroups: [metrics.k8s.io]
    resources: [pods, nodes]
    verbs: [get, list]
  - apiGroups: [apiregistration.k8s.io]
    resources: [apiservices]
    verbs: [get, list, watch]
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    verbs: [get, list, watch]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [roles, rolebindings, clusterroles, clusterrolebindings]
    verbs: [get, list, watch]
  - apiGroups: [admissionregistration.k8s.io]
    resources: [validatingadmissionpolicies, validatingadmissionpolicybindings]
    verbs: [get, list, watch]
  - apiGroups: [argoproj.io]
    resources: [applications, applicationsets, appprojects]
    verbs: [get, list, watch]
  # app.secrets.create: the namespace of an app and its env Secrets, which
  # the agent cannot read back. ladder-agent-secrets limits what they are.
  - apiGroups: [""]
    resources: [namespaces, secrets]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: [[ .Agent ]]
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: [[ .Agent ]]}
subjects:
  - {kind: ServiceAccount, name: [[ .Agent ]], namespace: [[ .AgentNamespace ]]}
---
# Objects, events and pod logs of every namespace, for the apps' pages, the
# watch on apps and kube.read.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: [[ .Agent ]]-view
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: view}
subjects:
  - {kind: ServiceAccount, name: [[ .Agent ]], namespace: [[ .AgentNamespace ]]}
---
# Its own state, its token, the read-only account's password and its own
# Deployment, which an upgrade patches.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: [[ .Agent ]]
  namespace: [[ .AgentNamespace ]]
rules:
  - apiGroups: [""]
    resources: [configmaps, secrets]
    verbs: [get, list, watch, create, update]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames:
      - [[ .Agent ]]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: [[ .Agent ]]
  namespace: [[ .AgentNamespace ]]
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: [[ .Agent ]]}
subjects:
  - {kind: ServiceAccount, name: [[ .Agent ]], namespace: [[ .AgentNamespace ]]}
---
# In Argo CD's namespace: whether its Ingress has a certificate, the host of
# that Ingress, and the refresh of ApplicationSets on a push.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: [[ .Agent ]]
  namespace: [[ .ArgoCDNamespace ]]
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames:
      - [[ .TLSSecret ]]
    verbs: [get]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    resourceNames:
      - [[ .Ingress ]]
    verbs: [get, update, patch]
  - apiGroups: [argoproj.io]
    resources: [applicationsets]
    verbs: [patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: [[ .Agent ]]
  namespace: [[ .ArgoCDNamespace ]]
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: [[ .Agent ]]}
subjects:
  - {kind: ServiceAccount, name: [[ .Agent ]], namespace: [[ .AgentNamespace ]]}
---
# Without cluster-admin, the agent writes Opaque Secrets only, outside
# kube-*: never a ServiceAccount or bootstrap token another controller fills
# in, which it could then read through a name it may get.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: [[ .Agent ]]-secrets
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["*"]
        resources: [secrets]
        operations: [CREATE, UPDATE]
  matchConditions:
    - name: the-agent
      expression: request.userInfo.username == 'system:serviceaccount:[[ .AgentNamespace ]]:[[ .Agent ]]'
    - name: without-setup-access
      expression: "!authorizer.group('rbac.authorization.k8s.io').resource('clusterrolebindings').check('create').allowed()"
  validations:
    - expression: "object.type == 'Opaque'"
      message: The agent writes only Opaque Secrets
    - expression: "!request.namespace.startsWith('kube-')"
      message: The agent writes no Secret into kube-* namespaces
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: [[ .Agent ]]-secrets
spec:
  policyName: [[ .Agent ]]-secrets
  validationActions: [Deny]
---
# Without cluster-admin, the agent refreshes ApplicationSets on a push and
# changes nothing else of theirs: what they generate stays the platform's.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: [[ .Agent ]]-refresh
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [argoproj.io]
        apiVersions: ["*"]
        resources: [applicationsets, applications]
        operations: [UPDATE]
  matchConditions:
    - name: the-agent
      expression: request.userInfo.username == 'system:serviceaccount:[[ .AgentNamespace ]]:[[ .Agent ]]'
    - name: without-setup-access
      expression: "!authorizer.group('rbac.authorization.k8s.io').resource('clusterrolebindings').check('create').allowed()"
  validations:
    - expression: "object.spec == oldObject.spec"
      message: Without setup access the agent only refreshes Argo CD's objects
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: [[ .Agent ]]-refresh
spec:
  policyName: [[ .Agent ]]-refresh
  validationActions: [Deny]
