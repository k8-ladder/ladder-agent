# Ladder agent (spec §5.3). Applied by {{.PublicURL}}/install.sh, which also
# creates Secret ladder/ladder-agent with the agent token and the cloud URL.
#
# To remove the agent; Gitea, Argo CD and the apps keep running:
#   kubectl delete namespace ladder
#   kubectl delete clusterrolebinding ladder-agent
apiVersion: v1
kind: Namespace
metadata:
  name: ladder
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ladder-agent
  namespace: ladder
---
# The agent keeps cluster-admin for its whole life (spec §5.8). The cloud can
# use it only through the fixed methods of the agent protocol.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ladder-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: ladder-agent
    namespace: ladder
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ladder-agent
  namespace: ladder
  labels: {app.kubernetes.io/name: ladder-agent}
spec:
  replicas: 1
  # One agent at a time runs setup.
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: ladder-agent}
  template:
    metadata:
      labels: {app.kubernetes.io/name: ladder-agent}
    spec:
      serviceAccountName: ladder-agent
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: agent
          image: {{.Image}}
          imagePullPolicy: {{.PullPolicy}}
          env:
            - name: LADDER_BE_URL
              valueFrom: {secretKeyRef: {name: ladder-agent, key: url}}
            - name: LADDER_AGENT_TOKEN
              valueFrom: {secretKeyRef: {name: ladder-agent, key: token}}
            - name: POD_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
          ports:
            - {name: http, containerPort: 8081}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {}
---
# Gitea posts pushes here (POST /hooks/git), and the agent has Argo CD read
# git at once instead of at its next poll.
apiVersion: v1
kind: Service
metadata:
  name: ladder-agent
  namespace: ladder
  labels: {app.kubernetes.io/name: ladder-agent}
spec:
  selector: {app.kubernetes.io/name: ladder-agent}
  ports:
    - {name: http, port: 80, targetPort: http}
