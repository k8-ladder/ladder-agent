# Ladder agent (spec §5.3). Applied by {{.PublicURL}}/install.sh, which also
# creates Secret ladder/ladder-agent with the agent token and the cloud URL.
#
# To remove the agent; Argo CD and the apps keep running:
#   kubectl delete namespace ladder
#   kubectl delete clusterrolebinding ladder-agent ladder-agent-view ladder-agent-setup
#   kubectl delete clusterrole ladder-agent
#   kubectl delete validatingadmissionpolicy,validatingadmissionpolicybinding ladder-agent-secrets ladder-agent-refresh
#   kubectl -n argocd delete role,rolebinding ladder-agent
#
# The agent upgrades its own Deployment: what runs in its namespace meets the
# restricted Pod Security Standard, as the agent does.
apiVersion: v1
kind: Namespace
metadata:
  name: ladder
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ladder-agent
  namespace: ladder
---
# cluster-admin for setup only (spec §5.8): once setup is done, the agent
# gives itself the narrow ClusterRole ladder-agent and deletes this binding.
# Applying another platform later needs it back. The cloud can use the agent
# only through the fixed methods of the agent protocol.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ladder-agent-setup
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: ladder-agent
    namespace: ladder
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ladder-agent
  namespace: ladder
  labels: {app.kubernetes.io/name: ladder-agent}
spec:
  replicas: 1
  # A new agent, after an upgrade or a restart, gets ready once it has
  # connected to the cloud; until then the old one keeps running.
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels: {app.kubernetes.io/name: ladder-agent}
  template:
    metadata:
      labels: {app.kubernetes.io/name: ladder-agent}
    spec:
      serviceAccountName: ladder-agent
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: agent
          image: {{.Image}}
          imagePullPolicy: {{.PullPolicy}}
          env:
            - name: LADDER_BE_URL
              valueFrom: {secretKeyRef: {name: ladder-agent, key: url}}
            - name: LADDER_AGENT_TOKEN
              valueFrom: {secretKeyRef: {name: ladder-agent, key: token}}
            - name: POD_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
          ports:
            - {name: http, containerPort: 8081}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 2
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {}
