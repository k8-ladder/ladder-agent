# The agent's release. Every push to main that changes the agent tests it,
# builds its image for linux/amd64 and linux/arm64, since people's clusters run
# either, pushes it to GHCR as its version, signs it with cosign, keyless, and
# only then tags it latest. Agents run a new version only once they have
# checked that this workflow on main signed its digest. The version is the
# build time.
#
# Last comes the release agent-<version>: install.sh and agent.yaml with the
# image by digest, each with the cosign bundle of this workflow. Ladder clouds
# offer the agent of the latest release to their clusters and install it from
# there, so a new version needs no deploy of a cloud.
name: release

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

# One build at a time, so latest is the last push's.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test ./...

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      # The release of install.sh and the manifest.
      contents: write
      packages: write
      # cosign keyless: Fulcio certifies this workflow's identity with the
      # job's OIDC token.
      id-token: write
    steps:
      - uses: actions/checkout@v7
      # GHCR wants the owner in lower case.
      - run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ladder-agent" >> "$GITHUB_ENV"
          echo "VERSION=$(date -u +%Y%m%d%H%M%S)" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@v4.1.3
        with:
          cosign-release: v3.1.4
      # The Dockerfile cross-compiles: both platforms build here without
      # emulation.
      - uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ env.VERSION }}
          push: true
          # latest only once the image is signed, below.
          tags: ${{ env.IMAGE }}:${{ env.VERSION }}
          labels: |
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=Apache-2.0
          cache-from: type=gha,scope=agent
          cache-to: type=gha,mode=max,scope=agent
      # A Sigstore bundle of the image index's digest, an OCI referrer next to
      # the image, with the certificate of this workflow on main and its Rekor
      # entry. Agents check it before they update (internal/imagesig).
      - run: cosign sign --yes "$IMAGE@$DIGEST"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      # latest names a signed image only. imagetools keeps the index as it
      # is, so the digest stays the signed one.
      - run: docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE@$DIGEST"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      # The release, last: a cloud offers its version as soon as it is the
      # latest, and the image is signed by then.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go run ./cmd/installfiles -image "$IMAGE@$DIGEST" -out "$RUNNER_TEMP/release"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - run: |
          for f in install.sh agent.yaml; do
            cosign sign-blob --yes --bundle "$RUNNER_TEMP/release/$f.sigstore.json" "$RUNNER_TEMP/release/$f"
          done
          gh release create "agent-$VERSION" "$RUNNER_TEMP"/release/* --latest \
            --title "Agent $VERSION" --notes "Agent \`$IMAGE@$DIGEST\`, built from $GITHUB_SHA. Install it into the cluster of your current kubectl context: \`curl -fsSL $RELEASES/download/agent-$VERSION/install.sh | LADDER_URL=<your Ladder> LADDER_INSTALL_URL=$RELEASES/download/agent-$VERSION sh\`."
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.build.outputs.digest }}
          RELEASES: ${{ github.server_url }}/${{ github.repository }}/releases
      - run: echo "Agent \`$IMAGE:$VERSION\` (\`$DIGEST\`), signed, and the release agent-$VERSION, which Ladder clouds now offer to their clusters." >> "$GITHUB_STEP_SUMMARY"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
