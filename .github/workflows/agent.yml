# The agent image. Every push to main that changes the agent tests it, builds
# it for linux/amd64 and linux/arm64, since people's clusters run either,
# pushes it to GHCR as its version and as latest, and signs it with cosign,
# keyless: agents run a new version only once they have checked that this
# workflow on main signed its digest (spec §5.9). The version is the build
# time, as install-local.sh and k8s/deploy.sh make it. The deploy workflow then
# has the cloud offer it to clusters (hetzner/README.md).
name: agent

on:
  push:
    branches: [main]
    paths:
      - ladder-agent/**
      - .github/workflows/agent.yml
  workflow_dispatch:

# One build at a time, so latest is the last push's.
concurrency:
  group: agent
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: ladder-agent/go.mod
          cache-dependency-path: ladder-agent/go.sum
      - run: go test ./...
        working-directory: ladder-agent

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # cosign keyless: Fulcio certifies this workflow's identity with the
      # job's OIDC token.
      id-token: write
    steps:
      - uses: actions/checkout@v7
      # GHCR wants the owner in lower case.
      - run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ladder-agent" >> "$GITHUB_ENV"
          echo "VERSION=$(date -u +%Y%m%d%H%M%S)" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The Dockerfile cross-compiles: both platforms build here without
      # emulation. The deploy workflow reads the version from the label.
      - uses: sigstore/cosign-installer@v4
        with:
          cosign-release: v3.1.4
      - uses: docker/build-push-action@v7
        id: build
        with:
          context: ladder-agent
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ env.VERSION }}
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=agent
          cache-to: type=gha,mode=max,scope=agent
      # A Sigstore bundle of the image index's digest, an OCI referrer next to
      # the image, with the certificate of this workflow on main and its Rekor
      # entry. Agents check it before they update (ladder-agent/internal/imagesig).
      - run: cosign sign --yes "$IMAGE@$DIGEST"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - run: echo "Agent \`$IMAGE:$VERSION\` (\`$DIGEST\`), signed. The deploy workflow has the cloud offer it to clusters." >> "$GITHUB_STEP_SUMMARY"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
