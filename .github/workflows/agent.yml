# The agent image. Every push to main that changes the agent tests it, builds
# it for linux/amd64 and linux/arm64, since people's clusters run either,
# pushes it to GHCR as its version and as latest, and signs it with cosign,
# keyless: agents run a new version only once they have checked that this
# workflow on main signed its digest (spec §5.9). The version is the build
# time, as install-local.sh and k8s/deploy.sh make it. The deploy workflow then
# has the cloud offer it to clusters (hetzner/README.md).
name: agent

on:
  push:
    branches: [main]
    paths:
      - ladder-agent/**
      # The release of install.sh and agent.yaml goes with each agent version.
      - ladder-be/internal/api/install/**
      - ladder-be/cmd/installfiles/**
      - .github/workflows/agent.yml
  workflow_dispatch:

# One build at a time, so latest is the last push's.
concurrency:
  group: agent
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: ladder-agent/go.mod
          cache-dependency-path: ladder-agent/go.sum
      - run: go test ./...
        working-directory: ladder-agent

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      # The release of install.sh and the manifest.
      contents: write
      packages: write
      # cosign keyless: Fulcio certifies this workflow's identity with the
      # job's OIDC token.
      id-token: write
    steps:
      - uses: actions/checkout@v7
      # GHCR wants the owner in lower case.
      - run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ladder-agent" >> "$GITHUB_ENV"
          echo "VERSION=$(date -u +%Y%m%d%H%M%S)" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The Dockerfile cross-compiles: both platforms build here without
      # emulation. The deploy workflow reads the version from the label.
      - uses: sigstore/cosign-installer@v4.1.3
        with:
          cosign-release: v3.1.4
      - uses: docker/build-push-action@v7
        id: build
        with:
          context: ladder-agent
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ env.VERSION }}
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=agent
          cache-to: type=gha,mode=max,scope=agent
      # A Sigstore bundle of the image index's digest, an OCI referrer next to
      # the image, with the certificate of this workflow on main and its Rekor
      # entry. Agents check it before they update (ladder-agent/internal/imagesig).
      - run: cosign sign --yes "$IMAGE@$DIGEST"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      # The release people may install from instead of a cloud (spec §5.3):
      # install.sh, which takes LADDER_URL, and agent.yaml with this image by
      # digest, each with the cosign bundle of this workflow. Published where
      # the cloud has no say, it is what LADDER_INSTALL_URL names.
      - uses: actions/setup-go@v7
        with:
          go-version-file: ladder-be/go.mod
          cache-dependency-path: ladder-be/go.sum
      - run: go run ./cmd/installfiles -image "$IMAGE@$DIGEST" -out "$RUNNER_TEMP/release"
        working-directory: ladder-be
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - run: |
          for f in install.sh agent.yaml; do
            cosign sign-blob --yes --bundle "$RUNNER_TEMP/release/$f.sigstore.json" "$RUNNER_TEMP/release/$f"
          done
          gh release create "agent-$VERSION" "$RUNNER_TEMP"/release/* --latest \
            --title "Agent $VERSION" --notes "Agent \`$IMAGE@$DIGEST\`. Install it from here, not from a cloud: \`curl -fsSL <this release>/install.sh | LADDER_URL=<your Ladder> LADDER_INSTALL_URL=<this release> sh\`."
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.build.outputs.digest }}
      - run: echo "Agent \`$IMAGE:$VERSION\` (\`$DIGEST\`), signed, and the release agent-$VERSION. The deploy workflow has the cloud offer it to clusters." >> "$GITHUB_STEP_SUMMARY"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
