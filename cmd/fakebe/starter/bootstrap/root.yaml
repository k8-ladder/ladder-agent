apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: [[ .ArgoCDNamespace ]]
spec:
  project: default
  source:
    repoURL: [[ .RepoURL ]]
    targetRevision: main
    path: bootstrap
  destination:
    server: https://kubernetes.default.svc
    namespace: [[ .ArgoCDNamespace ]]
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
