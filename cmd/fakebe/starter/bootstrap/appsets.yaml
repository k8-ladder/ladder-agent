apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: appsets
  namespace: [[ .ArgoCDNamespace ]]
spec:
  project: default
  source:
    repoURL: [[ .RepoURL ]]
    targetRevision: main
    path: argocd
  destination:
    server: https://kubernetes.default.svc
    namespace: [[ .ArgoCDNamespace ]]
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
